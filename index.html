<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ニコニコ サムネグリッド画像メーカー</title>
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --border: #dcdcd6; --accent: #2f6fed; --accent-text: #ffffff; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --surface: #222221; --text: #ececea; --muted: #9a9a94;
      --border: #3a3a37; --accent: #5b92ff; --accent-text: #0b1020; --err: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.5;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 9px 10px; font-size: .95rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  input[type=color] { width: 100%; height: 38px; padding: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-top: 12px; }
  .row > div { flex: 1 1 130px; }
  .check { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; flex: 0 0 auto !important; }
  .check label { margin: 0; color: var(--text); font-size: .9rem; }
  button { font: inherit; cursor: pointer; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  details summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  #status { margin: 8px 0 0; font-size: .9rem; color: var(--muted); min-height: 1.4em; }
  #status.err { color: var(--err); }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  #meta { font-size: .9rem; color: var(--muted); margin-bottom: 10px; }
  #preview { width: 100%; height: auto; display: block; border: 1px solid var(--border); border-radius: 6px; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>ニコニコ サムネグリッド画像メーカー</h1>
  <p class="sub">マイリスト/シリーズのサムネを色順に並べて、1枚のPNG画像にします。</p>

  <section class="panel">
    <label for="url">マイリスト / シリーズのURL</label>
    <input type="text" id="url" placeholder="https://www.nicovideo.jp/user/123456/mylist/12345678">

    <div class="row">
      <div><label for="cols">列数</label><input type="number" id="cols" value="10" min="1" max="30"></div>
      <div><label for="rows">行数</label><input type="number" id="rows" value="10" min="1" max="30"></div>
      <div>
        <label for="sort">並び順</label>
        <select id="sort">
          <option value="hue">色相順(虹グラデーション)</option>
          <option value="lightness">明るい順</option>
          <option value="none">並べ替えなし(元の順)</option>
        </select>
      </div>
      <div class="check"><input type="checkbox" id="snake"><label for="snake">スネーク配置</label></div>
    </div>

    <div class="row">
      <div>
        <label for="shape">セルの形</label>
        <select id="shape">
          <option value="0.5625">16:9(そのまま)</option>
          <option value="0.75">4:3(左右を少しトリミング)</option>
          <option value="1">正方形(中央をトリミング)</option>
        </select>
      </div>
      <div>
        <label for="cw">セルの幅(px)</label>
        <select id="cw">
          <option value="160">160</option>
          <option value="240" selected>240</option>
          <option value="320">320</option>
        </select>
      </div>
      <div><label for="gap">すき間(px)</label><input type="number" id="gap" value="0" min="0" max="40"></div>
      <div><label for="bg">背景色</label><input type="color" id="bg" value="#111111"></div>
    </div>

    <div class="row">
      <button class="primary" id="run">サムネを読み込む</button>
      <button id="save" disabled>PNGを保存</button>
      <button id="demo" title="APIなしでレイアウトだけ確認">デモ表示</button>
    </div>
    <p id="status"></p>
    <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
  </section>

  <section class="panel" id="result" hidden>
    <div id="meta"></div>
    <canvas id="preview"></canvas>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $('preview');
  const ctx = canvas.getContext('2d');
  let state = null; // { title, total, items: [{id,title,img,color,h,s,l}] }

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  // WorkerのベースURL(末尾に / を付けない)
  const API_BASE = 'https://niconico-color.sakotsu352vt.workers.dev';
  $('url').value = store.get('lastUrl') || '';

  function setStatus(msg, kind) {
    const el = $('status');
    el.className = kind === 'err' ? 'err' : '';
    el.innerHTML = kind === 'busy' ? '<span class="spin"></span>' : '';
    el.append(msg);
  }
  const setProgress = (r) => { $('barWrap').hidden = r == null; if (r != null) $('bar').style.width = (r * 100) + '%'; };

  // ---------- 色の解析 (ブラウザ内) ----------
  function rgbToHsv(r, g, b) {
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    const v = max / 255, s = max === 0 ? 0 : d / max;
    if (d === 0) return [0, s, v];
    let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
    return [h, s, v];
  }
  const hex = (n) => Math.round(n).toString(16).padStart(2, '0');

  // 調整用パラメータ
  const COLOR = {
    W: 64, H: 36,        // 縮小サイズ
    BINS: 36,            // 色相ヒストグラムの区間数 (10度刻み)
    S_ACHRO: 0.06,       // これ未満の彩度は無彩色候補 (パステルは 0.1〜 なので残る)
    V_DARK: 0.10,        // ほぼ真っ黒の画素も色相が不安定なので無彩色候補
    MERGE_BINS: 2,       // 山の間隔がこの区間数以内なら同じ色グループに統合
  };

  // 1) サムネを小さく縮小 → 2) 画素データを analyzePixels へ
  function analyze(img) {
    const { W, H } = COLOR;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingQuality = 'high';
    x.drawImage(img, 0, 0, W, H);
    return analyzePixels(x.getImageData(0, 0, W, H).data, W, H);
  }

  // 戻り値: { color:'#rrggbb', h:0-360, s:0-1, v:0-1, kind:'chroma'|'gray' }
  function analyzePixels(d, w, h) {
    const { BINS, S_ACHRO, V_DARK, MERGE_BINS } = COLOR;
    const hist = new Float64Array(BINS);              // 重み付き票
    const bSin = new Float64Array(BINS), bCos = new Float64Array(BINS);
    const bR = new Float64Array(BINS), bG = new Float64Array(BINS), bB = new Float64Array(BINS);
    const bArea = new Float64Array(BINS), bSat = new Float64Array(BINS);
    let aArea = 0, aR = 0, aG = 0, aB = 0;            // 無彩色の別集計

    // 3) 色空間変換(HSV) + 無彩色/有彩色の分離 + 4) 色相ヒストグラム
    const y0 = Math.floor(h * 0.08), y1 = Math.ceil(h * 0.92); // 上下の黒帯は除外
    for (let y = y0; y < y1; y++) {
      for (let i = 0; i < w; i++) {
        const k = (y * w + i) * 4, r = d[k], g = d[k + 1], b = d[k + 2];
        const [hh, s, v] = rgbToHsv(r, g, b);
        // 面積(中央ほどやや重く: 位置情報)
        const dx = (i + 0.5) / w - 0.5, dy = (y + 0.5) / h - 0.5;
        const area = 1 + 0.5 * (1 - Math.min(1, Math.hypot(dx, dy) / 0.6));

        if (s < S_ACHRO || v < V_DARK) {
          aArea += area; aR += r * area; aG += g * area; aB += b * area;
          continue;
        }
        // 票の重み = 面積 × 彩度 × 明度 (パステルでも 0 にはならない下駄つき)
        const wt = area * (0.25 + 0.75 * s) * (0.3 + 0.7 * v);
        const bin = Math.min(BINS - 1, Math.floor((hh / 360) * BINS));
        const rad = (hh * Math.PI) / 180;
        hist[bin] += wt;
        bSin[bin] += Math.sin(rad) * wt; bCos[bin] += Math.cos(rad) * wt;
        bR[bin] += r * wt; bG[bin] += g * wt; bB[bin] += b * wt;
        bArea[bin] += area; bSat[bin] += s * area;
      }
    }

    // 5) 近接区間の統合 (円環): ヒストグラムを軽く平滑化し、山登りで各区間を山に割り当て、
    //    近い山どうしを統合する。359度と1度は円環の添字計算で隣になる。
    const sm = Array.from({ length: BINS }, (_, i) =>
      (hist[(i + BINS - 1) % BINS] + 2 * hist[i] + hist[(i + 1) % BINS]) / 4);
    const peakOf = new Array(BINS).fill(-1);
    for (let i = 0; i < BINS; i++) {
      if (hist[i] === 0) continue;
      let p = i;
      for (;;) {
        const l = (p + BINS - 1) % BINS, r = (p + 1) % BINS;
        let best = p;
        if (sm[l] > sm[best]) best = l;
        if (sm[r] > sm[best]) best = r;
        if (best === p) break;
        p = best;
      }
      peakOf[i] = p;
    }
    const parent = Array.from({ length: BINS }, (_, i) => i);
    const find = (a) => (parent[a] === a ? a : (parent[a] = find(parent[a])));
    const peaks = [...new Set(peakOf.filter((p) => p >= 0))];
    for (const a of peaks) for (const b of peaks) {
      if (a < b && Math.min(b - a, BINS - (b - a)) <= MERGE_BINS) parent[find(a)] = find(b);
    }
    const groups = new Map();
    for (let i = 0; i < BINS; i++) {
      if (peakOf[i] < 0) continue;
      const key = find(peakOf[i]);
      const g = groups.get(key) || { W: 0, sin: 0, cos: 0, R: 0, G: 0, B: 0, area: 0, sat: 0 };
      g.W += hist[i]; g.sin += bSin[i]; g.cos += bCos[i];
      g.R += bR[i]; g.G += bG[i]; g.B += bB[i];
      g.area += bArea[i]; g.sat += bSat[i];
      groups.set(key, g);
    }

    // 6) 各グループのスコア = 重み付き画素数 × (0.6 + 0.4 × 色相のまとまり)
    // 7) 最高スコアのグループがメインカラー
    let best = null, chromaArea = 0;
    for (const g of groups.values()) {
      chromaArea += g.area;
      g.coherence = Math.hypot(g.sin, g.cos) / g.W;      // 1に近いほど色相が揃っている
      g.score = g.W * (0.6 + 0.4 * g.coherence);
      if (!best || g.score > best.score) best = g;
    }

    const grayResult = () => {
      const n = aArea || 1;
      const [r, g, b] = aArea ? [aR / n, aG / n, aB / n] : [128, 128, 128];
      const [, s, v] = rgbToHsv(r, g, b);
      return { color: `#${hex(r)}${hex(g)}${hex(b)}`, h: 0, s, v, kind: 'gray' };
    };
    if (!best) return grayResult();

    // 8) 無彩色との比較: 有彩色が十分に優勢でなければ無彩色を採用
    const total = chromaArea + aArea;
    const groupShare = best.area / total;                 // メイングループの面積比
    const chromaShare = chromaArea / total;               // 有彩色全体の面積比
    const meanS = best.sat / best.area;
    const vivid = meanS >= 0.55 && groupShare >= 0.12;    // 小さくても鮮やかな主役色
    const isChroma = groupShare >= 0.25 || vivid || (groupShare >= 0.12 && chromaShare >= 0.6);
    if (!isChroma) return grayResult();

    const r = best.R / best.W, g = best.G / best.W, b = best.B / best.W;
    let hue = (Math.atan2(best.sin, best.cos) * 180) / Math.PI;
    if (hue < 0) hue += 360;
    const [, s, v] = rgbToHsv(r, g, b);
    return { color: `#${hex(r)}${hex(g)}${hex(b)}`, h: hue, s, v, kind: 'chroma' };
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('image load failed'));
      img.src = src;
    });
  }

  async function mapLimit(arr, limit, fn) {
    let next = 0;
    await Promise.all(Array.from({ length: limit }, async () => {
      while (next < arr.length) { const i = next++; await fn(arr[i], i); }
    }));
  }

  // ---------- 並べ替え・配置 ----------
  function sortItems(items, mode) {
    if (mode === 'none') return [...items];
    if (mode === 'lightness') return [...items].sort((a, b) => b.v - a.v);
    // 有彩色は色相順、無彩色(モノクロ・低彩度画像)は明るい順で末尾へ
    const chroma = items.filter((i) => i.kind === 'chroma').sort((a, b) => a.h - b.h);
    const gray = items.filter((i) => i.kind === 'gray').sort((a, b) => b.v - a.v);
    return [...chroma, ...gray];
  }
  function applySnake(items, cols) {
    const out = [];
    for (let i = 0; i < items.length; i += cols) {
      const row = items.slice(i, i + cols);
      out.push(...((i / cols) % 2 === 1 && row.length === cols ? row.reverse() : row));
    }
    return out;
  }

  // ---------- 描画 ----------
  function drawCover(img, x, y, w, h) {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    const scale = Math.max(w / iw, h / ih);
    const sw = w / scale, sh = h / scale;
    ctx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, x, y, w, h);
  }

  function render() {
    if (!state) return;
    const cols = Math.max(1, Math.min(30, +$('cols').value || 10));
    const rows = Math.max(1, Math.min(30, +$('rows').value || 10));
    const n = cols * rows;

    if (n > state.items.length && state.total > state.items.length) {
      setStatus('件数を増やしたので「サムネを読み込む」を押し直してください', 'err');
    }

    let items = sortItems(state.items.slice(0, n), $('sort').value);
    if ($('snake').checked) items = applySnake(items, cols);

    const cw = +$('cw').value;
    const ch = Math.round(cw * +$('shape').value);
    const gap = Math.max(0, +$('gap').value || 0);

    canvas.width = cols * cw + (cols + 1) * gap;
    canvas.height = rows * ch + (rows + 1) * gap;
    ctx.fillStyle = $('bg').value;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    items.forEach((it, i) => {
      const r = Math.floor(i / cols), c = i % cols;
      drawCover(it.img, gap + c * (cw + gap), gap + r * (ch + gap), cw, ch);
    });

    $('meta').textContent =
      `${state.title || ''}  ・  ${items.length} 枚  ・  ${canvas.width} × ${canvas.height}px`;
    $('result').hidden = false;
    $('save').disabled = false;
  }
  ['cols', 'rows', 'sort', 'snake', 'shape', 'cw', 'gap', 'bg'].forEach((id) =>
    $(id).addEventListener('input', render));

  // ---------- 読み込み ----------
  $('run').addEventListener('click', async () => {
    const url = $('url').value.trim();
    const base = API_BASE;
    if (!/(mylist|series)\/\d+/.test(url)) return setStatus('マイリスト/シリーズのURLを入力してください', 'err');
    store.set('lastUrl', url);

    $('run').disabled = true; $('save').disabled = true;
    try {
      setStatus('プレイリストを取得中…', 'busy');
      const res = await fetch(`${base}/playlist?url=${encodeURIComponent(url)}`);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);

      const n = (Math.max(1, +$('cols').value || 10)) * (Math.max(1, +$('rows').value || 10));
      const targets = json.items.slice(0, n);
      const items = new Array(targets.length);
      let done = 0, failed = 0;
      setProgress(0);

      await mapLimit(targets, 6, async (t, i) => {
        try {
          const img = await loadImage(`${base}/thumb?u=${encodeURIComponent(t.thumbnailUrl)}`);
          items[i] = { id: t.id, title: t.title, img, ...analyze(img) };
        } catch { failed++; }
        done++;
        setStatus(`サムネを読み込み中… ${done} / ${targets.length}`, 'busy');
        setProgress(done / targets.length);
      });

      state = { title: json.source.title, total: json.count, items: items.filter(Boolean) };
      setProgress(null);
      const note = [
        json.count > n ? `全${json.count}件のうち先頭${n}件を使用` : null,
        failed ? `${failed}件は読み込めませんでした` : null,
      ].filter(Boolean).join(' / ');
      setStatus(`完了: ${state.items.length}枚${note ? '(' + note + ')' : ''}`);
      render();
    } catch (e) {
      setProgress(null);
      setStatus(`失敗しました: ${e.message}`, 'err');
    } finally {
      $('run').disabled = false;
    }
  });

  // ---------- 保存 ----------
  $('save').addEventListener('click', () => {
    canvas.toBlob((blob) => {
      if (!blob) return setStatus('画像の書き出しに失敗しました', 'err');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `niconico-grid-${canvas.width}x${canvas.height}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }, 'image/png');
  });

  // ---------- デモ ----------
  $('demo').addEventListener('click', () => {
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const items = Array.from({ length: 100 }, (_, i) => {
      const gray = i >= 90;
      const h = rnd() * 360, s = gray ? 0.03 : 0.5 + rnd() * 0.4, l = 0.3 + rnd() * 0.4;
      const c = document.createElement('canvas'); c.width = 320; c.height = 180;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 320, 180);
      g.addColorStop(0, `hsl(${h} ${s * 100}% ${l * 100}%)`);
      g.addColorStop(1, `hsl(${(h + 25) % 360} ${s * 100}% ${Math.max(0.15, l - 0.15) * 100}%)`);
      x.fillStyle = g; x.fillRect(0, 0, 320, 180);
      x.fillStyle = 'rgba(255,255,255,.85)'; x.font = 'bold 40px sans-serif'; x.fillText(String(i + 1), 14, 56);
      return { id: 'demo' + i, title: 'demo', img: c, h, s, v: l, kind: gray ? 'gray' : 'chroma' };
    });
    state = { title: 'デモ', total: 100, items };
    setStatus('デモデータを表示しています');
    render();
  });
})();
</script>
</body>
</html>
